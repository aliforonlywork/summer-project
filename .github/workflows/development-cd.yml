name: Development CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Development Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-site
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Development Environment
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: development-env

    steps:
      - name: Download development artifact
        uses: actions/download-artifact@v5
        with:
          name: development-site
          path: dist

      - name: Verify development deployment artifact
        run: |
          test -f dist/index.html
          echo "Development environment deployment artifact is ready."