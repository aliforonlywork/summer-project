name: Development CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HTMLHint
        run: npm run lint:html

      - name: Run Stylelint
        run: npm run lint:css

      - name: Run complete lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html