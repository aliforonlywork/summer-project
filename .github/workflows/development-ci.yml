name: Development CI

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:html
      - run: npm run lint:css
      - run: npm run lint
      - run: npm run build
      - run: test -d dist && test -f dist/index.html